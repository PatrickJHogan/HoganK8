apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/PatrickJHogan/HoganK8.git
    targetRevision: main
    path: infrastructure/cert-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
