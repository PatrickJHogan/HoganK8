apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-routes
  namespace: kube-system
data:
  routes.yaml: |
    http:
      middlewares:
        nextcloud-dav: { redirectRegex: { regex: "^https://([^/]+)/\\.well-known/(card|cal)dav", replacement: "https://${1}/remote.php/dav/", permanent: true } }

      routers:
        mealie: { entryPoints: [ websecure ], tls: {},  rule: "Host(`cook.hogans.at`) || Host(`mealie.eaglecomputerrepairsc.com`)", service: mealie }
        audiobookshelf: {entryPoints: [ websecure ], tls: {},  rule: "Host(`book.hogans.at`)", service: audiobookshelf }
        linkwarden: { entryPoints: [ websecure ], tls: {},  rule: "Host(`lw.hogans.at`)", service: linkwarden }
        immich : { entryPoints: [ websecure ], tls: {},  rule: "Host(`pic.hogans.at`) || Host(`pic.eaglecomputerrepairsc.com`)", service: immich }
        homeassistant: { entryPoints: [ websecure ], tls: {},  rule: "Host(`ha.hogans.at`) || Host(`hass.eaglecomputerrepairsc.com`)", service: homeassistant }
        nextcloud: { entryPoints: [ websecure ], tls: {},  rule: "Host(`nextcloud.eaglecomputerrepairsc.com`)", service: nextcloud, middlewares: [ nextcloud-dav ] }
        foundry: { entryPoints: [ websecure ], tls: {},  rule: "Host(`vtt.eaglecomputerrepairsc.com`)", service: foundry }
        matrix: { entryPoints: [ websecure ], tls: {},  rule: "Host(`mat.eaglecomputerrepairsc.com`) && (PathPrefix(`/_matrix/`) || PathPrefix(`/_synapse/client/`))", service: matrix }
        matrix-fed: { entryPoints: [ matrixfed ], tls: {},  rule: "Host(`mat.eaglecomputerrepairsc.com`) && PathPrefix(`/_matrix/`)", service: matrix }
        bitwarden: { entryPoints: [ websecure ], tls: {},  rule: "Host(`mm.eaglecomputerrepairsc.com`) || Host(`bw.hogans.at`)", service: bitwarden }
      services:
        mealie: { loadBalancer: { servers: [ { url: "http://10.42.0.1:9925" } ] } }
        audiobookshelf: { loadBalancer: { servers: [ { url: "http://10.42.0.10:13378" } ] } }
        linkwarden: { loadBalancer: { servers: [ { url: "http://10.42.0.1:3903" } ] } }
        immich: { loadBalancer: { servers: [ { url: "http://10.42.0.10:2283" } ] } }
        homeassistant: { loadBalancer: { servers: [ { url: "http://10.42.0.5:8123" } ] } }
        nextcloud: { loadBalancer: { servers: [ { url: "http://10.42.0.1:42271" } ] } }
        foundry: { loadBalancer: { servers: [ { url: "http://10.42.0.1:30000" } ] } }
        matrix: { loadBalancer: { servers: [ { url: "http://10.42.0.10:8008" } ] } }
        matrix-fed: { loadBalancer: { servers: [ { url: "http://10.42.0.10:8008" } ] } }
        bitwarden: { loadBalancer: { servers: [ { url: "http://10.42.0.1:8000" } ] } }
