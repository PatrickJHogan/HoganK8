apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-eaglecomputerrepairsc-com
  namespace: kube-system
spec:
  secretName: wildcard-eaglecomputerrepairsc-com-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - eaglecomputerrepairsc.com
    - "*.eaglecomputerrepairsc.com"
