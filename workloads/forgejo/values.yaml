replicaCount: 1
strategy:
  type: Recreate

nodeSelector:
  hoganlab/location: cloud
persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path-retain
  volumeName: pvc-9e34ec9d-268b-4451-ab09-2d9e21156d9c
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
podSecurityContext:
  fsGroup: 1000
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: git.hogans.at
      paths:
        - path: /
          pathType: Prefix
gitea:
  admin:
    existingSecret: forgejo-admin
    email: patrickjhogan@gmail.com
  config:
    server:
      DOMAIN: git.hogans.at
      ROOT_URL: https://git.hogans.at/
      DISABLE_SSH: true
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
    database:
      DB_TYPE: sqlite3
